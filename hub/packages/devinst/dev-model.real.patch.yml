# 测试实例专用（真模型）：与主线一样走 OpenCode Go，只用 DeepSeek V4.1 Flash。
# 内核补丁只认 apiKeyEnv。密钥值由 start-real.sh 用 scripts/model-key.mjs 从 0600 文件读进本进程环境，不写进这个文件。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
- id: llm-pi-ai
  config:
    providers:
      opencode-go:
        displayName: OpenCode Go (dev instance)
        apiKeyEnv: HUB_OPENCODE_KEY
        api: openai-completions
        baseURL: https://opencode.ai/inference/go/openai/v1
        defaultContextWindow: 1000000
        defaultMaxTokens: 8192
        headers:
          x-opencode-session: dsh-hub-dev-instance
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (OpenCode Go, dev)
            input:
              - text
