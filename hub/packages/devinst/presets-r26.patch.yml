      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: hub-bot
        name: 通用助理
        description: 第0版人设，Owner未确认；能说话、写草稿、跑命令（分级）。
        order: 106
        plugins:
          - id: hub-tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              write: true
              edit: true
              readImage: false
              applyPatch: false
          - id: hub-command-scope
            name: cordis:group
            group: true
            isolate:
              shell: true
              shellEnv: true
            config:
              - id: hub-shell-env
                name: '@deepseek-ai/dsh-shell-env'
              - id: hub-bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                config:
                  timeoutMs: 60000
                  maxTimeoutMs: 600000
                  maxOutputBytes: 1048576
              - id: hub-tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                config:
                  enableRunInBackground: false
                  promoteOnTimeout: false
